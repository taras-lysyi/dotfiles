# Click-to-open routing for kitty.
# Referenced from kitty.conf via:  include open-actions.conf
# Docs: https://sw.kovidgoyal.net/kitty/open_actions/

# --- Plain text files: open in a NEW tmux split running $EDITOR (current window).
protocol file
mime text/*
action launch --type=background ~/.local/bin/tmux-open-file $FILE_PATH

# --- Source code / config (fallback when MIME isn't text/*)
protocol file
ext py,js,jsx,ts,tsx,rs,go,c,h,cpp,hpp,java,rb,php,sh,bash,zsh,fish,lua,vim,toml,yaml,yml,json,xml,md,markdown,conf,ini,env,sql,kdl
action launch --type=background ~/.local/bin/tmux-open-file $FILE_PATH

# --- Images: open with macOS default (Preview).
protocol file
mime image/*
action launch --type=background open -- $FILE_PATH

# --- Videos / audio: macOS default.
protocol file
mime video/*,audio/*
action launch --type=background open -- $FILE_PATH

# --- PDFs.
protocol file
mime application/pdf
action launch --type=background open -- $FILE_PATH

# --- URLs: open in default browser.
protocol http,https
action launch --type=background open -- $URL

# --- Directories: open new kitty window there.
protocol file
mime inode/directory
action launch --type=os-window --cwd=$FILE_PATH

# --- Fallback for unknown file types: macOS default.
protocol file
action launch --type=background open -- $FILE_PATH
