# ═══════════════════════════════════════════════════════════════════
# KITTY CONFIGURATION - Performance & Visual Only (No Keybind Changes)
# ═══════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────
# PERFORMANCE OPTIMIZATIONS
# ───────────────────────────────────────────────────────────────────
# Faster screen updates
repaint_delay 6
input_delay 1
sync_to_monitor no
wayland_enable_ime no

# ───────────────────────────────────────────────────────────────────
# FONT CONFIGURATION
# ───────────────────────────────────────────────────────────────────
# Using FiraCode Nerd Font (better icons, ligatures)
font_family      FiraCode Nerd Font Mono
bold_font        FiraCode Nerd Font Mono Bold
italic_font      FiraCode Nerd Font Mono Light
bold_italic_font FiraCode Nerd Font Mono SemiBold

# Alternative: JetBrainsMono (uncomment to use)
# font_family      JetBrainsMono NFM
# bold_font        JetBrainsMono NFM Bold
# italic_font      JetBrainsMono NFM Italic
# bold_italic_font JetBrainsMono NFM Bold Italic

font_size 13.0

# Font rendering (enable ligatures for FiraCode)
disable_ligatures never

# VS Code-like spacing (tighter than 120%)
adjust_line_height  0
adjust_column_width 0

# ───────────────────────────────────────────────────────────────────
# CURSOR & MOUSE
# ───────────────────────────────────────────────────────────────────
cursor_shape block
cursor_blink_interval 0
cursor_stop_blinking_after 15.0

mouse_hide_wait 1.0
url_color #89b4fa
url_style curly
detect_urls yes
open_url_with default
# Treat OSC 8 terminal hyperlinks (emitted by ls --hyperlink, eza, bat, etc.) as clickable.
underline_hyperlinks always
show_hyperlink_targets yes
# Alt+click = open link/path under cursor (routed via open-actions.conf).
# Alt+click works even when tmux has grabbed the mouse.
mouse_map alt+left press   grabbed,ungrabbed mouse_handle_click link
mouse_map alt+left release grabbed,ungrabbed mouse_handle_click link
include open-actions.conf

# Keyboard hint mode — highlight tokens on screen with letter labels.
#   cmd+shift+p → paths     → letter → open in tmux split via nvim
#   cmd+shift+f → file:line → letter → open at line in tmux split
#   cmd+shift+u → URLs      → letter → open in browser (kitty default)
map cmd+shift+p kitten hints --type path --program 'launch --type=background ~/.local/bin/tmux-open-file'
map cmd+shift+f kitten hints --type linenum --program 'launch --type=background ~/.local/bin/tmux-open-file'
map cmd+shift+u kitten hints --type url

# Copy on select (like VS Code)
copy_on_select yes

# ───────────────────────────────────────────────────────────────────
# SCROLLBACK (Better for development)
# ───────────────────────────────────────────────────────────────────
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_pager_history_size 10

# Better scrolling
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 1.0

# ───────────────────────────────────────────────────────────────────
# TERMINAL BELL (Disable annoying sounds)
# ───────────────────────────────────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell no
bell_on_tab no

# ───────────────────────────────────────────────────────────────────
# WINDOW LAYOUT
# ───────────────────────────────────────────────────────────────────
remember_window_size yes
initial_window_width 1200
initial_window_height 800

# Window padding (breathing room)
window_padding_width 4

# Draw minimal borders
draw_minimal_borders yes
window_border_width 1.0
placement_strategy center

# ───────────────────────────────────────────────────────────────────
# TAB BAR
# ───────────────────────────────────────────────────────────────────
# Tabs disabled — using tmux for multiplexing.
tab_bar_style hidden
# tab_bar_min_tabs 1
# tab_bar_edge bottom
# tab_powerline_style slanted
# tab_title_template {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# ───────────────────────────────────────────────────────────────────
# COLORSCHEME - Catppuccin Mocha (matches Neovim & Cursor)
# ───────────────────────────────────────────────────────────────────
background #1e1e1e
foreground #cdd6f4
selection_background #585b70
selection_foreground #cdd6f4
url_color #89b4fa
cursor #f5e0dc
cursor_text_color #1e1e1e

# Tabs
active_tab_background #89b4fa
active_tab_foreground #11111b
inactive_tab_background #313244
inactive_tab_foreground #7f849c
tab_bar_background #181825

# Windows
active_border_color #89b4fa
inactive_border_color #313244

# normal
color0 #45475a
color1 #f38ba8
color2 #a6e3a1
color3 #f9e2af
color4 #89b4fa
color5 #f5c2e7
color6 #94e2d5
color7 #bac2de

# bright
color8 #585b70
color9 #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8

# extended colors
color16 #fab387
color17 #f5e0dc

# ───────────────────────────────────────────────────────────────────
# MACOS SPECIFIC
# ───────────────────────────────────────────────────────────────────
wayland_titlebar_color system
macos_titlebar_color system
# Borderless window (Ghostty-style).
#   yes                   = no titlebar, no traffic lights
#   titlebar-only         = keep traffic lights, hide title
#   titlebar-and-corners  = hide title + round corners
hide_window_decorations yes
macos_quit_when_last_window_closed yes
# Toggle fullscreen on demand.
map cmd+enter toggle_fullscreen
macos_option_as_alt yes
macos_thicken_font 0
macos_quit_when_last_window_closed yes

# ───────────────────────────────────────────────────────────────────
# ADVANCED FEATURES
# ───────────────────────────────────────────────────────────────────
# Better clipboard integration
clipboard_control write-clipboard write-primary read-clipboard read-primary

# Shell integration (better prompt, etc.)
shell_integration enabled
allow_remote_control no
single_instance yes

# Update check
update_check_interval 24

# Confirm before closing window with running programs
confirm_os_window_close 1

# ───────────────────────────────────────────────────────────────────
# YOUR EXISTING KEYBINDS (Unchanged)
# ───────────────────────────────────────────────────────────────────
# Kitty tabs/windows fully disabled — tmux owns multiplexing.
# Pass Ctrl+, and Ctrl+. through as proper CSI-u so tmux extended-keys sees them.
map ctrl+. send_text all \x1b[46;5u
map ctrl+, send_text all \x1b[44;5u
# Forward common cmd shortcuts to tmux as Alt-key sequences.
map shift+cmd+t send_text all \x1bt
# Shift+Cmd+C → Alt+w (close tab in tmux). Overrides kitty native copy-to-clipboard.
map shift+cmd+c send_text all \x1bw
# Kill all kitty native tab/window keys so they never intercept.
# (shift+cmd+c forwarded above)
map shift+ctrl+, no_op
map shift+ctrl+. no_op
map kitty_mod+t no_op
map kitty_mod+q no_op
map kitty_mod+w no_op
map kitty_mod+n no_op
map kitty_mod+right no_op
map kitty_mod+left no_op
map kitty_mod+1 no_op
map kitty_mod+2 no_op
map kitty_mod+3 no_op
map kitty_mod+4 no_op
map kitty_mod+5 no_op
map kitty_mod+6 no_op
map kitty_mod+7 no_op
map kitty_mod+8 no_op
map kitty_mod+9 no_op
map kitty_mod+enter no_op
map shift+enter send_text normal,application \x1b[13;2u
