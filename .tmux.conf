set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",*:hyperlinks"
set -as terminal-overrides ",xterm-kitty:Tc"
# Kitty graphics protocol passthrough (yazi, image previews)
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -g escape-time 0
set -g repeat-time 0
set -s extended-keys on
set -g extended-keys-format csi-u
set -g focus-events on
set -g mouse on
set -g history-limit 50000
# Phone-friendly scrollback shortcuts (no prefix needed)
bind-key -n PageUp copy-mode -eu
bind-key -n F1 copy-mode
# Simple frame: plain borders, active pane signaled by title block only
set -g pane-border-lines single
set -g pane-border-indicators off
set -g pane-border-status top
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#89b4fa'
# Rich pane title: [idx]  cmd  •  cwd/basename  •  custom-title
# Pane border shows only the program-set pane_title (e.g. "pi - editing config").
# Falls back to cwd basename when no title set. Hides command name + hostname noise.
set -g pane-border-format '#{?pane_active,#[bg=#89b4fa#,fg=#11111b#,bold] #{pane_index}  #{?#{!=:#{pane_title},#{host_short}},#{pane_title},#{b:pane_current_path}} #[default],#[fg=#6c7086] #{pane_index}  #{?#{!=:#{pane_title},#{host_short}},#{pane_title},#{b:pane_current_path}} }'

# --- Status bar + mode indicator ------------------------------------------
set -g status on
set -g status-position bottom
set -g status-interval 1
set -g status-left-length 40
set -g status-right-length 80
set -g status-style 'bg=#181825,fg=#cdd6f4'
set -g status-left  '#[bg=#89b4fa,fg=#11111b,bold] #S #[bg=#181825,fg=#89b4fa]▌'
set -g status-right ''
set -g window-status-format         '#[fg=#6c7086]#I#[fg=#45475a]:#[fg=#6c7086]#W'
set -g window-status-current-format '#[fg=#89b4fa,bold]#I#[fg=#45475a]:#[fg=#cdd6f4,bold]#W'
set -g window-status-separator     '#[fg=#45475a]  '
set -g message-style 'bg=#89b4fa,fg=#11111b,bold'
set -g set-clipboard on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# Programs can update tmux window name (top bar) AND pane title (border).
# Claude Code, nvim, etc. emit OSC sequences for this.
setw -g automatic-rename on
set -g allow-rename on
# Prefer pane_title (OSC 2 from running program) over command name.
# Falls back to command name when no title is set.
# Tab name: use program-set pane_title if available, else cwd basename.
setw -g automatic-rename-format '#{?#{!=:#{pane_title},#{host_short}},#{pane_title},#{b:pane_current_path}}'
set -g detach-on-destroy off
set-environment -g WORKMUX_BACKEND tmux

# prefix moved off C-b so Neovim (nvim-tree) gets it
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# window / session navigation
# Tab nav: Ctrl+. / Ctrl+, (via kitty CSI-u). Also bind plain Alt variants as fallback.
bind-key -n C-. next-window
bind-key -n C-, previous-window
bind-key -n M-]  next-window
bind-key -n M-[  previous-window
bind-key -n M-l  next-window
bind-key -n M-h  previous-window
bind-key -n M-t if-shell -F '#{==:#{pane_current_command},fzf}' 'send-keys M-t' 'new-window -c "#{pane_current_path}"'
bind-key -n M-w kill-window
bind-key -n M-r if-shell -F '#{==:#{pane_current_command},fzf}' 'send-keys M-r' 'command-prompt -I "#W" "rename-window -- \"%%\""'
# Move current window/tab left/right (focus follows window).
bind-key -n M-Left  swap-window -d -t -1
bind-key -n M-Right swap-window -d -t +1
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9
# M-Space: enter pane mode normally; inside float (scratch) it toggles float off.
bind-key -n M-Space if-shell '[ "#{session_name}" = "scratch" ]' \
  'run-shell "~/.tmux/plugins/tmux-floax/scripts/floax.sh"' \
  'switch-client -T pane ; refresh-client -S'
bind-key -n M-m switch-client -T move \; refresh-client -S

# Pane border color also reflects mode.
set -g pane-active-border-style 'fg=#{?#{==:#{client_key_table},pane},#a6e3a1,#{?#{==:#{client_key_table},move},#fab387,#89b4fa}}'
bind-key -n M-d detach-client
bind-key -n M-o display-popup -E -w 90% -h 85% 'WORKMUX_BACKEND=tmux workmux dashboard'
bind-key -n C-f display-popup -E -w 70% -h 80% '~/.local/bin/tmux-zellij-keys'

# pane mode (zellij-style persistent; Esc/Enter exits)
bind-key -T pane h select-pane -Z -L \; switch-client -T pane
bind-key -T pane j select-pane -Z -D \; switch-client -T pane
bind-key -T pane k select-pane -Z -U \; switch-client -T pane
bind-key -T pane l select-pane -Z -R \; switch-client -T pane
# Resize: in float (scratch session) H/K shrink, J/L grow (floax is symmetric).
# In tile mode keep directional resize.
bind-key -T pane H if-shell '[ "#{session_name}" = "scratch" ]' \
  'run-shell "~/.tmux/plugins/tmux-floax/scripts/zoom-options.sh in"' \
  'resize-pane -L 5' \; switch-client -T pane
bind-key -T pane J if-shell '[ "#{session_name}" = "scratch" ]' \
  'run-shell "~/.tmux/plugins/tmux-floax/scripts/zoom-options.sh out"' \
  'resize-pane -D 3' \; switch-client -T pane
bind-key -T pane K if-shell '[ "#{session_name}" = "scratch" ]' \
  'run-shell "~/.tmux/plugins/tmux-floax/scripts/zoom-options.sh in"' \
  'resize-pane -U 3' \; switch-client -T pane
bind-key -T pane L if-shell '[ "#{session_name}" = "scratch" ]' \
  'run-shell "~/.tmux/plugins/tmux-floax/scripts/zoom-options.sh out"' \
  'resize-pane -R 5' \; switch-client -T pane
bind-key -T pane u split-window -v -b -c '#{pane_current_path}' \; switch-client -T pane
bind-key -T pane d split-window -v -c '#{pane_current_path}' \; switch-client -T pane
bind-key -T pane v split-window -h -c '#{pane_current_path}' \; switch-client -T pane
bind-key -T pane n if-shell -F '#{>=:#{pane_width},#{pane_height}}' 'split-window -h -c "#{pane_current_path}"' 'split-window -v -c "#{pane_current_path}"' \; switch-client -T pane
bind-key -T pane x kill-pane \; switch-client -T pane
# 'f' fullscreen: float-aware (scratch session = float full, else tile zoom).
bind-key -T pane f if-shell '[ "#{session_name}" = "scratch" ]' \
  'run-shell "~/.tmux/plugins/tmux-floax/scripts/zoom-options.sh full"' \
  'resize-pane -Z' \; switch-client -T pane
bind-key -T pane r command-prompt -I '#{pane_title}' 'select-pane -T "%%"; switch-client -T pane'
# Floating pane handled by tmux-floax (see plugin block at bottom).
# 'w' inside pane mode triggers floax via the same root binding.
bind-key -T pane w run-shell '~/.tmux/plugins/tmux-floax/scripts/floax.sh' \; switch-client -T root
bind-key -T pane Escape switch-client -T root \; refresh-client -S
# SessionX manager: Option+Space, then s.
bind-key -T pane s run-shell '~/.tmux/plugins/tmux-sessionx/scripts/sessionx.sh'
# Enter does NOT exit — use Escape.
# Catch-all: any unbound key stays in pane mode (zellij behavior).
bind-key -T pane Any switch-client -T pane

# move mode (zellij-style persistent; Esc/Enter exits)
bind-key -T move h run-shell 'tmux swap-pane -t "{left-of}" 2>/dev/null || true' \; switch-client -T move
bind-key -T move j run-shell 'tmux swap-pane -t "{down-of}" 2>/dev/null || true' \; switch-client -T move
bind-key -T move k run-shell 'tmux swap-pane -t "{up-of}" 2>/dev/null || true' \; switch-client -T move
bind-key -T move l run-shell 'tmux swap-pane -t "{right-of}" 2>/dev/null || true' \; switch-client -T move
bind-key -T move Tab rotate-window -D \; switch-client -T move
bind-key -T move n rotate-window -U \; switch-client -T move
bind-key -T move Escape switch-client -T root \; refresh-client -S
# Catch-all: any unbound key stays in move mode.
bind-key -T move Any switch-client -T move

# workmux helpers on prefix
bind-key C-s display-popup -E -w 90% -h 85% 'WORKMUX_BACKEND=tmux workmux dashboard'
bind-key C-t run-shell 'WORKMUX_BACKEND=tmux workmux sidebar --session'

# ---------------------------------------------------------------------------
# Plugins (TPM)
# ---------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/tmux-sessionx'

# SessionX: zellij-style session switcher with preview/create/rename/delete.
set -g @sessionx-preview-location 'right'
set -g @sessionx-preview-ratio '55%'
set -g @sessionx-window-height '90%'
set -g @sessionx-window-width '80%'
set -g @sessionx-layout 'reverse'
set -g @sessionx-filter-current 'false'
set -g @sessionx-fzf-builtin-tmux 'on'
set -g @sessionx-bind-accept 'enter'
set -g @sessionx-bind-rename-session 'f2'
set -g @sessionx-bind-kill-session 'f4'
set -g @sessionx-bind-tree-mode 'f3'
set -g @sessionx-bind-configuration-path 'ctrl-g'
set -g @sessionx-bind-abort 'esc'

# Resurrect + Continuum: auto-save every 15min, auto-restore on tmux start.
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-save 'S'
# Manual resurrect keys (no prefix): Alt+S save, Alt+R restore.
bind-key -n M-S run-shell '~/.tmux/plugins/tmux-resurrect/scripts/save.sh'
bind-key -n M-R run-shell '~/.tmux/plugins/tmux-resurrect/scripts/restore.sh'

# extrakto: fzf-extract any text (URL/path/word/line) from scrollback.
set -g @extrakto_key 'tab'
set -g @extrakto_split_direction 'p'   # popup
set -g @extrakto_popup_size '90%,60%'
set -g @extrakto_default_opt 'open'    # default action = open (URLs in browser, files in $EDITOR)

# tmux-fzf-url: list every URL/path in current pane → fzf → open.
set -g @fzf-url-bind 'u'
set -g @fzf-url-fzf-options '-w 80% -h 60% --multi --prompt=" url > "'
set -g @fzf-url-history-limit '2000'

# Root-table shortcuts so prefix is not required.
# Alt+u  → fzf URL picker
# Alt+x  → extrakto (extract/open/edit anything from scrollback)
bind-key -n M-u run-shell '~/.tmux/plugins/tmux-fzf-url/fzf-url.sh'
bind-key -n M-x if-shell -F '#{==:#{pane_current_command},fzf}' 'send-keys M-x' 'run-shell "~/.tmux/plugins/extrakto/scripts/open.sh"'
# Also expose in pane mode for muscle memory.
bind-key -T pane u run-shell '~/.tmux/plugins/tmux-fzf-url/fzf-url.sh' \; switch-client -T root
bind-key -T pane e run-shell '~/.tmux/plugins/extrakto/scripts/open.sh' \; switch-client -T root

# Floax: persistent floating pane (zellij-style).
# Toggle: Alt+Space then w (matches old zellij pane-mode 'w').
# Menu (resize/fullscreen/embed): Alt+Space then W.
set -g @floax-bind '-n M-g'                # direct root toggle
set -g @floax-bind-menu '-n M-G'           # direct root menu
set -g @floax-width  '85%'
set -g @floax-height '85%'
set -g @floax-border-color '#89b4fa'
set -g @floax-text-color  '#cdd6f4'
set -g @floax-session-name 'scratch'
set -g @floax-change-path 'true'
set -g @floax-title 'floax  (M-Space -/+/f/r to resize)'

# Direct float resize without menu (zellij-style; only effective when float open).
bind-key -T pane '-' run-shell '~/.tmux/plugins/tmux-floax/scripts/zoom-options.sh in'    \; switch-client -T pane
bind-key -T pane '=' run-shell '~/.tmux/plugins/tmux-floax/scripts/zoom-options.sh out'   \; switch-client -T pane
bind-key -T pane '+' run-shell '~/.tmux/plugins/tmux-floax/scripts/zoom-options.sh out'   \; switch-client -T pane
bind-key -T pane R   run-shell '~/.tmux/plugins/tmux-floax/scripts/zoom-options.sh reset' \; switch-client -T pane

run '~/.tmux/plugins/tpm/tpm'
